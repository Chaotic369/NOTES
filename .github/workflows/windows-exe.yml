name: Build ntnotes.exe (Rust)

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Folder containing Cargo.toml (use . if ntnotes is the repo root)"
        required: false
        default: "ntnotes"
        type: string
  push:
    paths:
      - "ntnotes/**"
      - ".github/workflows/build-ntnotes.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ inputs.project_dir || 'ntnotes' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project_dir || 'ntnotes' }}

      - name: Build release exe
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: ntnotes-windows
          path: ${{ inputs.project_dir || 'ntnotes' }}/target/release/ntnotes.exe
          if-no-files-found: error